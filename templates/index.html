<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>NLP - Emotion Detection</title>
    <link rel="stylesheet"
          href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <div class="card">
        <h1>NLP - Emotion Detection</h1>
        <p>Enter text to detect the dominant emotion.</p>

        <label for="textToAnalyze">Text to analyze</label>
        <textarea id="textToAnalyze" rows="5"
                  placeholder="I am glad this happened"></textarea>

        <button type="button" onclick="RunSentimentAnalysis()">
            Run Sentiment Analysis
        </button>

        <h2>Result of Emotion Detection</h2>
        <div id="system_response">
            Your result will appear here.
        </div>
    </div>

    <script src="{{ url_for('static', filename='mywebscript.js') }}"></script>
</body>
</html>
